# Bristol/London -> Berlin & Amsterdam (either order) -> Barcelona -> home
#
#   flightfinder search trips/2026-10-berlin-amsterdam-barcelona.yaml

name: Berlin, Amsterdam & Barcelona (late Oct 2026)
currency: GBP
travellers: 1

# How much an hour of door-to-door travel is worth to you. Higher = prefer
# faster journeys; 0 = purely cheapest. A night train/coach is credited with
# the hotel night it saves.
value_of_time: 10
hotel_night: 70

start:
  # Add extra_cost / extra_minutes to the city you'd have to travel to first,
  # e.g. {place: london, extra_cost: 20, extra_minutes: 150} if you live in Bristol.
  from: [bristol, london]
  depart: [2026-10-26, 2026-10-27]

stops:
  # Same group = visit in either order.
  - {place: berlin, nights: 1-3, group: north}
  - {place: amsterdam, nights: 1-3, group: north}
  - {place: barcelona, arrive: [2026-10-30, 2026-10-31]}

end:
  to: [bristol, london]
  depart: [2026-11-05, 2026-11-06]   # the following Thursday or Friday

notes:
  - >-
    26-30 Oct 2026 is half term for most English schools (incl. Bristol and
    London), so flights out of the UK on the 26th/27th will be pricier than usual.
  - >-
    Amsterdam-Berlin rail is disrupted Oct-Dec 2026 (Hanover-Berlin line closed;
    ICEs diverted via Hamburg, ~7h). The European Sleeper night train runs
    Amsterdam->Berlin Mon/Wed/Fri and Berlin->Amsterdam Tue/Thu/Sun.
