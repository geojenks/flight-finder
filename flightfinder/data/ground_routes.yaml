# --- Amsterdam <-> Berlin -------------------------------------------------
# DB is rebuilding Hanover-Berlin: the line is closed Oct-Dec 2026, so direct
# ICEs run via Hamburg (~70 min slower), and some need a change at Hanover.

- id: ice-amsterdam-berlin
  from: amsterdam
  to: berlin
  both_ways: true
  from_terminal: ASC
  to_terminal: BHF
  mode: train
  operator: NS / DB ICE (direct)
  duration: 5h45
  buffer: 15
  valid: [{to: 2026-10-01}, {from: 2027-01-01}]
  price: {from: 38, typical: 65, currency: EUR}
  url: https://www.nsinternational.com
  notes: About 6-7 direct trains a day. Seat reservation ~EUR 5.50 extra.

- id: ice-amsterdam-berlin-works-2026
  from: amsterdam
  to: berlin
  both_ways: true
  from_terminal: ASC
  to_terminal: BHF
  mode: train
  operator: NS / DB ICE (diverted via Hamburg)
  duration: 7h00
  buffer: 15
  valid: [{from: 2026-10-02, to: 2026-12-31}]
  price: {from: 38, typical: 70, currency: EUR}
  url: https://www.nsinternational.com
  verify: true
  notes: >-
    Hanover-Berlin closed for rebuilding Oct-Dec 2026: 4 direct ICEs a day run
    via Hamburg-Harburg (~70 min slower), the rest need a change at Hanover.
    26-30 Oct 2026 Dutch works also reroute trains via the Hanzelijn.

