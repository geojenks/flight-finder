# Curated train / coach routes.
#
# There is no free, open fare API for European rail and coach, so these are
# GUIDE prices: `from` is the cheapest advance fare usually seen, `typical` is
# what you'll more often pay booking a few weeks out. The planner scores with
# `typical` and shows both. Always check the operator before booking.
#
# Fields
#   from, to        place keys (see places.yaml); add `both_ways: true` to mirror
#   from_terminal / to_terminal   terminal codes in those places
#   mode            train | night-train | coach
#   duration        e.g. 4h05 (terminal to terminal)
#   buffer          minutes to allow at the terminal (check-in etc.)
#   days            omitted = daily, or a list like [mon, wed, fri]
#   depart / arrive local times (optional); arrive_day_offset: 1 for overnight
#   valid           list of {from, to} date ranges when this entry applies
#   price           {from, typical, currency}
#   verify          true = schedule is uncertain; the report tells you to check
#
# Researched October 2026. Sources are in the notes / README.

- id: gwr-bristol-london
  from: bristol
  to: london
  both_ways: true
  from_terminal: BRI
  to_terminal: PAD
  mode: train
  operator: GWR
  duration: 1h45
  buffer: 15
  price: {from: 27, typical: 55, currency: GBP}
  url: https://www.gwr.com
  notes: Advance singles are cheapest; off-peak walk-up is much dearer.

