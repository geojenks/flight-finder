# Places the planner knows about. Each place has terminals; transfer_minutes and
# transfer_cost are a typical city-centre <-> terminal journey by public
# transport (one way, one adult, local currency). They feed the door-to-door
# comparison, so a "cheap" flight from a far-off airport is judged fairly.
#
# Add your own places here, or in a places file passed with --places.

bristol:
  name: Bristol
  country: GB
  currency: GBP
  terminals:
    - {code: BRS, name: Bristol Airport, kind: airport, minutes: 35, cost: 9}
    - {code: BRI, name: Bristol Temple Meads, kind: station, minutes: 10, cost: 0}
    - {code: BRC, name: Bristol Coach Station, kind: coach, minutes: 10, cost: 0}

