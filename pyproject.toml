[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flightfinder"
version = "0.1.0"
description = "Multi-stop trip planner: flexible dates, daisy-chained legs, and flight vs train vs coach comparison."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
google = ["fast-flights>=3.1,<4"]
dev = ["pytest>=8"]

[project.scripts]
flightfinder = "flightfinder.cli:main"

[tool.setuptools.packages.find]
include = ["flightfinder*"]

[tool.setuptools.package-data]
flightfinder = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
